<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
</head>
<body>
    <header>
        <h1>FishEye</h1>
    </header>

    <div>
        <h2>Video editor</h2>

        <div id="upload">
            <input type="file" id="video-upload">
        </div>

        <video width="640" height="360" controls id="video-player">
            <source src="" type="video/mp4"> <!-- should add a prompt to upload a video here -->
        </video>
    </div>

    <div id="adjustments">
        <label>
            Brightness: <span id="brightness-value">100</span>%
            <input type="range" id="brightness" min="0" max="200" value="100">
        </label>
        <br>
        <label>
            Contrast: <span id="contrast-value">100</span>%
            <input type="range" id="contrast" min="0" max="500" value="100">
        </label>
        <br>
        <button id="reset-adjustments">Reset</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
